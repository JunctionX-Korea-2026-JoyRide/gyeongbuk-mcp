name: Full data regression

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 1 * *"

permissions:
  contents: read

concurrency:
  group: full-data-regression
  cancel-in-progress: false

jobs:
  data-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
      - name: Restore pinned raw-data cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw
          key: raw-data-${{ runner.os }}-${{ hashFiles('data/sources.toml') }}
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Download, verify, and build the snapshot
        run: make data-setup DATA_FETCH_ARGS=--force
      - name: Run all checks including real-data regression tests
        run: make check
